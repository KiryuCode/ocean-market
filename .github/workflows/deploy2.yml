# =============================================================================
# Ocean Market — SECOND deploy target
# =============================================================================
#
# Same app code as deploy.yml, different folder + pm2 process so you can run
# two copies of the site on one VPS.
#
# |                 | deploy.yml (site 1)     | deploy2.yml (site 2)      |
# |-----------------|-------------------------|---------------------------|
# | Server folder   | /web/ocean-market       | /web/ocean-market2        |
# | pm2 name        | ocean-market            | ocean-market2             |
# | Server .env     | /web/ocean-market/.env  | /web/ocean-market2/.env   |
#
# ONE-TIME setup on the VPS (site 2):
#   mkdir -p /web/ocean-market2
#   cp /web/ocean-market/.env /web/ocean-market2/.env   # then edit PORT, etc.
#   # Use a DIFFERENT PORT than site 1 (e.g. 4841 if site 1 uses 4840)
#   # Point nginx (or another vhost) at that PORT
#
# Shared secret (same as deploy.yml):
#   SSH_PRIVATE_KEY  — GitHub → Settings → Secrets and variables → Actions
#   (raw PEM or base64 of the key:  base64 -w0 < private_key)
#
# =============================================================================

name: Deploy 2 (ocean-market2)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HOST: 74.208.35.191
  REMOTE_USER: root
  REMOTE_DIR: /web/ocean-market2
  PM2_NAME: ocean-market2
  NODE_VERSION: "24"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------
      # 1. Checkout + quick local install (catches broken package-lock early)
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (CI only)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Smoke test npm ci
        run: npm ci

      # ------------------------------------------------------------------
      # 2. Write the deploy SSH key from GitHub secret → ~/.ssh/deploy_key
      # ------------------------------------------------------------------
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "${SSH_PRIVATE_KEY//[$' \t\r\n']/}" ]; then
            echo "ERROR: secrets.SSH_PRIVATE_KEY is empty."
            echo "Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Accept base64-encoded key OR raw PEM (with real newlines or \n)
          if printf '%s' "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/deploy_key 2>/dev/null \
            && grep -qE 'BEGIN .*PRIVATE KEY' ~/.ssh/deploy_key; then
            echo "SSH key: loaded from base64"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | sed 's/\r//g; s/\\n/\n/g' > ~/.ssh/deploy_key
            echo "SSH key: loaded as PEM text"
          fi

          # OpenSSH wants a trailing newline
          [ -s ~/.ssh/deploy_key ] && [ "$(tail -c1 ~/.ssh/deploy_key | wc -l)" -eq 0 ] && echo >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "ERROR: deploy_key is not a valid private key."
            echo "Re-save SSH_PRIVATE_KEY as full PEM or: base64 -w0 < keyfile"
            exit 1
          fi

          ssh-keyscan -H "${{ env.HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH ready for ${{ env.REMOTE_USER }}@${{ env.HOST }}"

      # ------------------------------------------------------------------
      # 3. Copy app files to the server (never overwrite .env or uploads)
      # ------------------------------------------------------------------
      - name: Rsync to server
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            --exclude node_modules \
            --exclude .env \
            --exclude .git \
            --exclude .github \
            --exclude local.db \
            --exclude local.db-shm \
            --exclude local.db-wal \
            --exclude public/uploads \
            app.js \
            cart.js \
            config.js \
            db.js \
            mail.js \
            package.json \
            package-lock.json \
            .env.example \
            views \
            public \
            scripts \
            "${{ env.REMOTE_USER }}@${{ env.HOST }}:${{ env.REMOTE_DIR }}/"

      # ------------------------------------------------------------------
      # 4. On the server: npm install, pm2 restart, health check
      # ------------------------------------------------------------------
      - name: Install, restart, health check
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ env.REMOTE_USER }}@${{ env.HOST }}" \
            REMOTE_DIR='${{ env.REMOTE_DIR }}' \
            PM2_NAME='${{ env.PM2_NAME }}' \
            bash -s <<'EOF'
          set -euo pipefail

          # ---- Node via nvm (non-interactive SSH does not load .bashrc) ----
          export NVM_DIR="${NVM_DIR:-/root/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            nvm use default >/dev/null 2>&1 || nvm use node >/dev/null 2>&1 || true
          fi
          # Fallback: newest nvm node binary dir
          if ! command -v npm >/dev/null 2>&1 && [ -d "$NVM_DIR/versions/node" ]; then
            export PATH="$(ls -d "$NVM_DIR"/versions/node/v*/bin | sort -V | tail -1):$PATH"
          fi

          command -v npm >/dev/null || { echo "ERROR: npm not found. Load nvm / install Node on the VPS."; exit 1; }
          command -v pm2 >/dev/null || { echo "ERROR: pm2 not found. Run: npm i -g pm2"; exit 1; }
          echo "node=$(command -v node) $(node -v)  pm2=$(command -v pm2)"

          # ---- App directory ----
          mkdir -p "${REMOTE_DIR}"
          cd "${REMOTE_DIR}"
          mkdir -p public/uploads/products

          if [ ! -f .env ]; then
            echo "WARNING: ${REMOTE_DIR}/.env is missing."
            echo "Copy .env.example → .env, set PORT (unique from site 1), MYSQL_*, etc."
          fi

          echo "==> npm ci"
          npm ci --omit=dev

          echo "==> pm2: ${PM2_NAME}"
          if pm2 describe "${PM2_NAME}" >/dev/null 2>&1; then
            pm2 restart "${PM2_NAME}" --update-env
          else
            pm2 start app.js --name "${PM2_NAME}"
          fi
          pm2 save
          pm2 status "${PM2_NAME}"

          # ---- Health check: use PORT from this folder's .env ----
          APP_PORT=3000
          if [ -f .env ]; then
            raw="$(grep -E '^[[:space:]]*PORT=' .env | tail -1 | cut -d= -f2- | tr -d '[:space:]' | tr -d \"\' || true)"
            if [[ "${raw:-}" =~ ^[0-9]+$ ]]; then
              APP_PORT="$raw"
            fi
          fi
          url="http://127.0.0.1:${APP_PORT}/"
          echo "==> Health check ${url}"

          ok=0
          for i in 1 2 3 4 5 6; do
            sleep 2
            code="$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 "$url" || true)"
            echo "  try ${i}: HTTP ${code:-000}"
            case "$code" in 200|301|302|304) ok=1; break ;; esac
          done

          if [ "$ok" -ne 1 ]; then
            echo "Health check failed."
            pm2 logs "${PM2_NAME}" --lines 40 --nostream
            exit 1
          fi

          echo "Deploy 2 complete → ${REMOTE_DIR} (pm2: ${PM2_NAME}, port: ${APP_PORT})"
          EOF
