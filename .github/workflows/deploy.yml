# Deploy Ocean Market to the VPS over SSH.
# Server: root@74.208.52.191  →  /web/ocean-market  (pm2: ocean-market, nginx → :3000)
#
# Required GitHub Actions secret:
#   SSH_PRIVATE_KEY  — private key authorized for root@74.208.52.191
#   (Settings → Secrets and variables → Actions → Secrets)
#
# Paste the full PEM including BEGIN/END lines. If libcrypto errors persist,
# store base64 instead: base64 -w0 < /path/to/private_key
#
# On the server, create once and leave in place:
#   /web/ocean-market/.env   (see .env.example / HOSTING.md)
#   MySQL database via scripts/init-mydb.sql

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HOST: 74.208.35.191
  REMOTE_USER: root
  REMOTE_DIR: /web/ocean-market
  NODE_VERSION: "24"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install (CI smoke check)
        run: npm ci

      - name: Configure SSH
        env:
          # Pass via env so multiline values are not mangled by shell quoting
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "${SSH_PRIVATE_KEY//[$' \t\r\n']/}" ]; then
            echo "ERROR: secrets.SSH_PRIVATE_KEY is empty or unset."
            echo "Set it under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi

          # 1) Prefer base64 (single-line Variables are reliable)
          decoded=0
          if printf '%s' "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/deploy_key 2>/dev/null \
            && grep -qE 'BEGIN .*PRIVATE KEY' ~/.ssh/deploy_key; then
            decoded=1
            echo "Loaded SSH key from base64-encoded variable"
          fi

          # 2) Raw PEM (real newlines or literal \n from the UI)
          if [ "$decoded" -eq 0 ]; then
            printf '%s' "$SSH_PRIVATE_KEY" | sed 's/\r$//' > ~/.ssh/deploy_key
            if ! grep -qE 'BEGIN .*PRIVATE KEY' ~/.ssh/deploy_key; then
              # literal backslash-n sequences
              printf '%s' "$SSH_PRIVATE_KEY" | sed 's/\r//g; s/\\n/\n/g' > ~/.ssh/deploy_key
            fi
            echo "Loaded SSH key as PEM text"
          fi

          # OpenSSH requires a trailing newline
          if [ -s ~/.ssh/deploy_key ] && [ "$(tail -c1 ~/.ssh/deploy_key | wc -l)" -eq 0 ]; then
            echo >> ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          # Fail early with a clear message (do not print key material)
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "ERROR: deploy_key is not a valid SSH private key (would cause libcrypto error)."
            echo "  size:  $(wc -c < ~/.ssh/deploy_key) bytes"
            echo "  lines: $(wc -l < ~/.ssh/deploy_key)"
            echo "  head:  $(head -1 ~/.ssh/deploy_key | tr -cd 'A-Za-z0-9 /+=' | cut -c1-40)..."
            echo ""
            echo "Fix: re-store secret SSH_PRIVATE_KEY as the full PEM, or base64 of the key file:"
            echo "  base64 -w0 < /path/to/private_key"
            exit 1
          fi
          echo "SSH private key OK ($(wc -l < ~/.ssh/deploy_key) lines)"

          ssh-keyscan -H "${{ env.HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync app to server
        run: |
          # Never overwrite .env, node_modules, or product uploads on the server
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            --exclude node_modules \
            --exclude .env \
            --exclude .git \
            --exclude .github \
            --exclude local.db \
            --exclude local.db-shm \
            --exclude local.db-wal \
            --exclude public/uploads \
            app.js \
            cart.js \
            config.js \
            db.js \
            mail.js \
            package.json \
            package-lock.json \
            .env.example \
            views \
            public \
            scripts \
            "${{ env.REMOTE_USER }}@${{ env.HOST }}:${{ env.REMOTE_DIR }}/"

      - name: Install and restart on server
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ env.REMOTE_USER }}@${{ env.HOST }}" \
            REMOTE_DIR='${{ env.REMOTE_DIR }}' \
            bash -s <<'EOF'
          set -euo pipefail

          # Non-interactive SSH skips .bashrc — load nvm / Node into PATH.
          export PATH="/usr/local/bin:/usr/bin:$PATH"

          # nvm (this server: /root/.nvm/versions/node/v24.x/bin/npm)
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ ! -s "$NVM_DIR/nvm.sh" ] && [ -s /root/.nvm/nvm.sh ]; then
            NVM_DIR=/root/.nvm
          fi
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            # shellcheck disable=SC1091
            . "$NVM_DIR/nvm.sh"
            # Activate default / current node (non-interactive has no shell hook)
            nvm use default >/dev/null 2>&1 || nvm use node >/dev/null 2>&1 || true
          fi
          # Fallback: newest nvm-installed node bin dir
          if ! command -v npm >/dev/null 2>&1 && [ -d "$NVM_DIR/versions/node" ]; then
            LATEST_NODE_BIN="$(ls -d "$NVM_DIR"/versions/node/v*/bin 2>/dev/null | sort -V | tail -1 || true)"
            if [ -n "${LATEST_NODE_BIN:-}" ]; then
              export PATH="$LATEST_NODE_BIN:$PATH"
            fi
          fi
          # Other common locations
          for d in /usr/local/node/bin /snap/bin; do
            [ -d "$d" ] && export PATH="$d:$PATH"
          done

          if ! command -v npm >/dev/null 2>&1; then
            echo "ERROR: npm not found on the server (non-interactive PATH)."
            echo "nvm expected at \$NVM_DIR ($NVM_DIR). Install Node once, e.g.:"
            echo "  curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash"
            echo "  . ~/.nvm/nvm.sh && nvm install 24 && nvm alias default 24"
            echo "  npm i -g pm2"
            echo "Then: which node npm pm2 && node -v"
            exit 1
          fi
          if ! command -v pm2 >/dev/null 2>&1; then
            echo "ERROR: pm2 not found on PATH. Install once (with nvm loaded):"
            echo "  . \"\$NVM_DIR/nvm.sh\" && npm i -g pm2 && pm2 -v"
            exit 1
          fi
          echo "Using node=$(command -v node) ($(node -v)) npm=$(command -v npm) pm2=$(command -v pm2)"

          cd "${REMOTE_DIR}"

          mkdir -p public/uploads/products

          if [ ! -f .env ]; then
            echo "WARNING: .env missing in ${REMOTE_DIR} — copy from .env.example before first use"
          fi

          echo "==> Installing dependencies"
          npm ci --omit=dev

          echo "==> Restarting pm2 process: ocean-market"
          if pm2 describe ocean-market >/dev/null 2>&1; then
            pm2 restart ocean-market --update-env
          else
            # First-time boot (PORT from .env; nginx should proxy to that port)
            # Prefer HOST=127.0.0.1 in .env when behind nginx
            pm2 start app.js --name ocean-market
          fi
          pm2 save
          pm2 status ocean-market

          echo "==> Health check"
          # App port comes from server .env (defaults to 3000; this host uses e.g. 4840)
          APP_PORT=3000
          if [ -f .env ]; then
            ENV_PORT="$(grep -E '^[[:space:]]*PORT=' .env | tail -1 | cut -d= -f2- | tr -d '[:space:]' | tr -d \"\' || true)"
            if [ -n "${ENV_PORT:-}" ] && [[ "$ENV_PORT" =~ ^[0-9]+$ ]]; then
              APP_PORT="$ENV_PORT"
            fi
          fi
          HEALTH_URL="http://127.0.0.1:${APP_PORT}/"
          echo "Checking ${HEALTH_URL}"
          # Allow a few seconds for MySQL connect + listen after pm2 restart
          ok=0
          for i in 1 2 3 4 5 6; do
            sleep 2
            code="$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 "$HEALTH_URL" || true)"
            echo "  attempt ${i}: HTTP ${code:-000}"
            if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ] || [ "$code" = "304" ]; then
              ok=1
              break
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "Health check failed against ${HEALTH_URL} — recent logs:"
            pm2 logs ocean-market --lines 40 --nostream
            exit 1
          fi
          echo "Deploy complete."
          EOF
