name: ocean-market

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ocean
      MYSQL_USER: ocean
      MYSQL_PASSWORD: ocean_pass
      MYSQL_ROOT_PASSWORD: ocean_root_dev
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ocean-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uocean", "-pocean_pass"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  web:
    build: .
    ports:
      - "${HOST_BIND:-0.0.0.0}:${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      NODE_ENV: production
      # Do not hardcode the sidecar. Production .env (Aiven avnadmin) must win.
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
    volumes:
      - ./.env:/app/.env:ro
      - ./public/uploads:/app/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    # mail.adavis.shop → mailserver container IP on the shared Docker bridge.
    # Fragile if that IP changes — refresh after `docker network inspect mailserver_default`.
    extra_hosts:
      - "mail.adavis.shop:172.20.0.3"
    networks:
      - default
      - mailserver_default

volumes:
  ocean-mysql:

networks:
  mailserver_default:
    external: true
