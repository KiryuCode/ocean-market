name: ocean-market

# Production uses Aiven MySQL via .env (MYSQL_HOST=…aivencloud.com).
# No local MySQL sidecar — it burned RAM on zen88 and was unused.

services:
  web:
    build: .
    ports:
      - "${HOST_BIND:-0.0.0.0}:${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      NODE_ENV: production
    volumes:
      - ./.env:/app/.env:ro
      - ./public/uploads:/app/public/uploads
    restart: unless-stopped
    # mail.adavis.shop → mailserver container IP on the shared Docker bridge.
    # Fragile if that IP changes — refresh after `docker network inspect mailserver_default`.
    extra_hosts:
      - "mail.adavis.shop:172.20.0.3"
    networks:
      - default
      - mailserver_default

networks:
  mailserver_default:
    external: true
